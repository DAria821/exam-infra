events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        servername ;

        location / {
            resolver 127.0.0.11 valid=30s;
            set $upstream http://app:5000/;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}